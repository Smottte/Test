services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pantry
      POSTGRES_USER: pantry
      POSTGRES_PASSWORD: pantry
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://pantry:pantry@db:5432/pantry
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.1
    depends_on:
      - db
      - ollama
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    environment:
      REACT_APP_API_BASE_URL: http://192.168.1.99:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  ollama:
